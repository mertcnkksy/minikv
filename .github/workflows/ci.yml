name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Byte-compile sources
        run: python -m compileall -q src tests benchmarks
      - name: Run tests
        run: python -m pytest -ra

  redis-compat:
    name: Compatibility with redis-cli and redis-py
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Install MiniKV and redis-py
        run: python -m pip install -e ".[dev]" redis
      - name: Run compatibility tests (skips are failures here)
        run: |
          python -m pytest tests/test_redis_compat.py -v -rs | tee compat.log
          if grep -q SKIPPED compat.log; then
            echo "::error::compatibility tests were skipped"
            exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t minikv:ci .
      - name: Smoke test
        env:
          MINIKV_SMOKE_HOST_PORT: "6380"
        run: bash scripts/docker_smoke_test.sh minikv:ci
      - name: Image size
        run: docker image ls minikv:ci --format 'minikv:ci is {{.Size}}'

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compare persistence modes
        run: >-
          python benchmarks/run_benchmarks.py --requests 20000 --pipelines 1,16
          --output benchmark-results.md --json benchmark-results.json
      - name: Add results to the job summary
        run: cat benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.*

  publish:
    name: Publish image to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, redis-compat, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
