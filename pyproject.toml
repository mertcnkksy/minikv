[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minikv"
dynamic = ["version"]
description = "A lightweight, Redis-inspired in-memory key-value database written in pure Python."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]
keywords = ["key-value", "database", "redis", "resp", "asyncio", "in-memory", "cache"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
minikv = "minikv.cli:main"

[tool.setuptools.dynamic]
version = { attr = "minikv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
